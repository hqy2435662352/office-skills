# chart_proposal_template.yaml -- Schema for {name}_chart_proposal.yaml
# Produced by Step 1 (LLM analysis) and consumed by Step 3 (scripted generation).
# The confirmed flag is checked by layer_gate.py --target 3.
# Traceability lets users verify samples against the source xlsx without trusting the LLM.
# 
# NOTE: This template uses ASCII-safe strings only to ensure compatibility with
# Python's default locale encoding (cp936 on Chinese Windows).
# If you need non-ASCII values (e.g. Chinese axis labels), pass
# encoding='utf-8' when loading this file with PyYAML.

# --- File Identity -------------------------------------------------------------
skill: chart-gen
version: "2.0"
source_file: "path/to/source.xlsx"
proposal_file: "chart_proposal.yaml"
status: pending                       # pending | confirmed | rejected

# --- Auxiliary Table (pivot / non-contiguous) -----------------------------------
# Populated when source data needs re-layout before charting.
# Example: pivot table with categories in non-adjacent columns (A, C, E).
auxiliary_table:
  needed: false                       # true = must create helper table before chart
  source_cells:                       # Formula references (always use "=Sheet!Cell")
    - "=Sheet1!C12"
    - "=Sheet1!F16"
  target_range: "Sheet1!AB8:AC13"     # Where formulas will be written
  formula_mode: formula               # Always "formula" (never "hardcoded")

# --- Chart Options (multi-chart proposals) --------------------------------------
# Step 1 may produce multiple options. Each entry is an independent chart proposal.
# selected_index indicates which option the user chose in Step 2 Human Gate.
chart_options:
  - index: 0
    binding_mode: explicit          # explicit (PREFERRED) | dataRange (fallback)
    chart_type: column                # column | bar | line | pie | ...
    sheet: Sheet1                     # Target sheet name
    anchor: D2:J18                    # Placement anchor (MUST be right of data, 2+ cols gap)
    title: "Monthly Sales Trend"      # Chart title
    preset: corporate                 # minimal | dark | corporate | magazine | dashboard | colorful | monochrome
    split_reason: ""                  # Non-empty if split: "magnitude_diff" | ""
    # --- Explicit binding (primary method — used when binding_mode = explicit) ---------
    explicit_binding:
      categories_range: "Sheet1!$A$2:$A$13"
      series:
        - name: "Sales Revenue (10k)"
          values_range: "Sheet1!$B$2:$B$13"
        - name: "Cost (10k)"
          values_range: "Sheet1!$C$2:$C$13"
    # --- Fallback: only used when binding_mode = dataRange ----------------------------
    data_range: ""                    # Full data range for --prop dataRange=
    manual_overrides:                 # Applied AFTER preset via officecli set --prop
      - prop: legend
        value: bottom
      # - prop: dataLabels
      #   value: outsideEnd
    series:                           # Series metadata (for traceability, not binding)
      - name: "Sales Revenue (10k)"
        values_range: "Sheet1!$B$2:$B$13"
        categories_range: "Sheet1!$A$2:$A$13"
        role: value                   # value = data series; category = x-axis label
      - name: "Cost (10k)"
        values_range: "Sheet1!$C$2:$C$13"
        role: value

selected_index: 0                     # Which chart_option the user chose in Step 2

# --- Traceability Table ---------------------------------------------------------
# Sampling verification table — users open the source xlsx and confirm samples
# match the values below. If they don't, the inferred data_range was wrong.
traceability:
  series:
    - name: "Sales Revenue (10k)"
      range: "Sheet1!$B$2:$B$13"
      samples_first_3: [120, 135, 148]   # First 3 non-empty values (head)
      samples_last_3: [162, 175, 188]     # Last 3 non-empty values (tail)
      recommended_type: column
      reason: "12-month comparison data, suitable for column chart"
    - name: "Cost (10k)"
      range: "Sheet1!$C$2:$C$13"
      samples_first_3: [85, 92, 98]
      samples_last_3: [105, 112, 120]
      recommended_type: column
      reason: "Same series overlay, shares X-axis month labels"
  categories:
    range: "Sheet1!$A$2:$A$13"
    samples_first_3: ["Jan", "Feb", "Mar"]
    role: x_axis_label

# --- Human Gate -----------------------------------------------------------------
confirmed: false                      # Set to true only after user confirms in Step 2
                                      # layer_gate.py --target 3 will BLOCK if confirmed != true

# --- Warnings / Notes -----------------------------------------------------------
notes:
  - "Empty rows detected at rows 8-10; confirm whether to exclude."
  # - "Non-contiguous columns detected: column C and E are data, column D is empty."
  # - "Magnitude difference >= 2 orders of magnitude; consider splitting charts."
