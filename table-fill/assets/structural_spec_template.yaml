# structural_spec.yaml — 目标 xlsx 结构变更规格
# 用于 rebuild_target.py，在 fill_cells.py 填写值之前修改目标坐标系

target_sheet: Sheet0

operations:
  # 删除旧数据行（含起止行，inclusive）
  - delete_rows: [2, 22]

  # 插入新行（放在要插入的位置之后，从后往前执行避免行号偏移）
  - insert_rows:
      - {after: 5, count: 3}
      - {after: 2, count: 1}

  # 合并单元格区域
  - merge_ranges:
      - "B2:B7"
      - "B8:B12"
