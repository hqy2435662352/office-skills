# fill_spec.yaml — v2.5 模板 (复制后按 digest/业务语义修改)
# 完整 schema 见 references/FILLSPEC.md。要点:
#   - fingerprints 必须 == prepare_manifest.json (prepare_run.py 输出)
#   - data 的 template_row 必须是合并区外的非锚点数据行
#   - 克隆行携带的未填列必须进 nulls
#   - 派生数值公式默认 ROUND(...,2) 防浮点残值 (text overflow)
#   - key_outputs 必须是被本 plan 写入的格
#   - Column-Record Matrix (字段行 × 产品列) 用 matrix 一等表达填, 禁止把
#     几百个源值烘成 literal sets (见下矩阵示例块)

task:
  intent: <一句话说明填充意图>
  selected_mod: NONE            # 或 MOD 名 (来自 mod_resolution.json)
  selected_mod_revision: null

inputs:
  sources: [<staged 源文件名>]
  target: <staged 目标文件名>
  source_sheets:
    - source: <staged 源文件名>
      sheets: [<展平过的源 sheet 名>]
  target_sheet: <目标 sheet 名>   # pptx 用 slide[N]/table[@id=M]

fingerprints:
  source_structure: <prepare_manifest.json.fingerprints.source_structure>
  target_structure: <prepare_manifest.json.fingerprints.target_structure>

mapping:
  # transforms:                        # 可选 — 命名 transform (columns/matrix 链引用)
  #   - name: fin_translate
  #     function: controlled_translation   # 受控翻译: 整值精确匹配, 未命中原样
  #     translations: {"宽片": "wide fin"}  #   (matrix 场景 sanctioned 词表)
  #   - name: strip_sku
  #     function: strip                    # 等价内置 trim (直接写 transforms: [trim])
  targets:
    - sheet: <目标 sheet 名>
      base_last_row: <目标 digest 的最后数据行>
      clone_roles:
        - role: spacer
        - role: title
          template_row: <目标块标题行>
          value: "<可选: 新块标题文本>"
        - role: header
          template_row: <目标块表头行>
        - role: data
          template_row: <非锚点数据行>
      rows:
        source: <展平条目 name (manifest.flattened[].name)>
        selectors:
          - column: <列>
            pattern: "<glob>"          # 或 not_pattern / not_value
        # sources:                    # 多源合并: 按列表顺序拼进同一数据块
        #   - source: <展平条目 name>
        #     selectors: [...]
      columns:
        - source: <源列>
          target: <目标列>
        # - target: <列>
        #   lookup: {name: <lookup名>, field: <字段>, missing: empty}
        # - source: [P, Q]
        #   target: N                  # 多列求和
        # - target: J
        #   value: "0"                 # 常量
        #   transform: round4          # 内置舍入: 15 位成本值防溢出
        #   precision: keep            # 显式接受长精度 (窄列溢出自负)
      lookups:                          # 可选
        - name: <lookup名>
          from: <lookup JSON 文件名>
          key_column: <源列>
          fields: [<字段列表>]
          missing: empty
      formulas:                         # 可选
        per_row:
          <列>: "IFERROR(ROUND(...,2),0)"   # {r}=数据行号
        aggregates:
          - col: <列>
            rows: "1:{n}"                    # {n}=数据行数
            formula: "IFERROR(SUM(T{r1}:T{r2})/SUM(S{r1}:S{r2}),0)"
            style: anchor
      merges:                           # 可选
        - col: <列>
          rows: "1:{n}"
          style: label                  # 或 anchor
      nulls:                            # 克隆残留置空 (必查!)
        - col: <列>
          rows: all                     # 或 [1,3] / "2:4"
      remove_rows: []                   # 源行数 < 模板行数时, 自底向上
      # ── Column-Record Matrix 替代 (ticket 06): 字段行 × 产品列 ──────
      # 客户参数表类 (fields 沿行轴、records 沿列轴) 用 matrix 一等表达,
      # Compiler 物化 field_map × record_map → 目标格 + source lineage;
      # 与上方 clone_roles/rows/columns 块语义互斥, 二选一。受控翻译
      # (宽片→wide fin、Heating pump→Cooling and Heating) 用
      # mapping.transforms 的 controlled_translation 函数, Z 码 trim 用
      # 内置 trim; 固定 title/footer 仍写 sets。
      # matrix:
      #   source:
      #     flatten: <展平源条目 name>      # manifest.flattened[].name
      #     field_axis: rows                 # v1 仅支持同构朝向
      #     record_axis: columns
      #     field_label_column: A            # 字段标签列 (缺省 A)
      #   target:
      #     field_axis: rows
      #     record_axis: columns
      #     field_label_column: A
      #   field_map:                         # 字段定位: 每侧 locator 三形式可混用
      #     - source: <源参数角色>            #   A. 字符串标签 (label 列精确匹配)
      #       target: <目标参数行>
      #       transforms: [trim, fin_translate]
      #     - source:                        #   B. composite match (推荐):
      #         match: {A: Cooling, B: Capacity, C: Btu/h}   # 多列 AND 精确匹配
      #       target:
      #         match: {A: Cooling, B: Capacity, C: Btu/h}
      #     - source:                        #   C. guarded explicit row (禁裸 row):
      #         row: 16
      #         expect: {B: Capacity}        #   行号 = 展平 CSV 的 orig; 事实守卫
      #       target:
      #         row: 10
      #         expect: {B: Capacity}
      #     重复命中 fail-closed: 0 → LOCATOR_NOT_FOUND, 1 → 解析,
      #     >1 → MATRIX_FIELD_LOCATOR_AMBIGUOUS (首命中已废止)
      #   record_map:                        # 产品记录列
      #     - {record: "12K", source_column: B, target_column: B}
      #     - {record: "18K", source_column: C, target_column: C}

decisions:
  - <业务决策, 每条一行>
gaps:
  - <数据缺口 / 未决项, 每条一行>
lineage:
  - source: <源展平 csv>
    role: primary
    note: <覆盖说明>
  - source: <lookup 文件>
    role: lookup
    note: <说明>

validation:
  required_coverage:
    - source: <源展平 csv>
      rows: [<关键源行号>]
  required_empty: []                # 额外 EMPTY 断言 (裸坐标或 /Sheet/A1)
  key_outputs: [<被写入的关键格, 如 A25, O25>]
